<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tarix 6-sinf: Qo'llanma va Testlar</title>
<style>
:root{--bg:#f6f4ee;--card:#fff;--tx:#1d2433;--pri:#1e3a5f;--ok:#2e7d32;--bad:#c62828;--bd:#ddd6c4}
@media (prefers-color-scheme:dark){:root{--bg:#121a28;--card:#1b2638;--tx:#e8ecf3;--pri:#8fb4e8;--bd:#2d3b52}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,Segoe UI,Roboto,sans-serif;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:12px}
header{display:flex;align-items:center;gap:10px;padding:8px 0}
header svg{width:44px;height:44px;flex:none}
h1{font-size:1.15rem;margin:0;color:var(--pri)}
.sub{font-size:.8rem;opacity:.7}
.tabs{display:flex;gap:6px;margin:8px 0}
.tabs button,.btn{flex:1;padding:11px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-size:1rem;cursor:pointer}
.tabs button.on,.btn.p{background:var(--pri);color:#fff;border-color:var(--pri)}
@media (prefers-color-scheme:dark){.tabs button.on,.btn.p{color:#0d1420}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:10px 0}
.topic{display:block;width:100%;text-align:left;margin:8px 0}
.guide p{margin:.5em 0}
input[type=text]{width:100%;padding:11px;font-size:1rem;border:2px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);margin-top:8px}
.ok{color:var(--ok);font-weight:600}.bad{color:var(--bad);font-weight:600}
.row{display:flex;gap:8px;margin-top:10px}
.key{font-size:.92rem}
</style>
</head>
<body>
<div class="wrap">
<header>
<svg viewBox="0 0 100 100"><rect width="100" height="100" rx="22" fill="#1e3a5f"/><path d="M20 70V35l30-15 30 15v35z" fill="#f2c14e"/><path d="M50 20 20 35h60z" fill="#fff"/><path d="M32 70V44h8v26zm14 0V44h8v26zm14 0V44h8v26z" fill="#1e3a5f"/></svg>
<div><h1>Tarix · 6-sinf</h1><div class="sub">Mavzu qo'llanmasi va testlar</div></div>
</header>
<div class="tabs">
<button id="t1" class="on" onclick="mode('s')">O'quvchi</button>
<button id="t2" onclick="mode('t')">O'qituvchi</button>
</div>
<div id="app"></div>
</div>
<script>
const T=[
{t:"Qadimgi Misr: piramidalar",g:["Qadimgi Misr Nil daryosi vodiysida vujudga kelgan. Nil har yili toshib, dalalarga unumdor loy qoldirgan.","Misr hukmdorlari fir'avnlar deb atalgan. Ular o'limdan keyin ham hayot davom etadi, deb ishonganlar.","Fir'avnlar uchun maxsus maqbaralar — piramidalar qurilgan. Eng mashhuri Xufu (Xeops) piramidasi Giza shahri yaqinida joylashgan.","Murdalar mumiyolangan, ya'ni maxsus usulda saqlangan. Misrliklar iyeroglif yozuvidan foydalanganlar."],
q:[["Qadimgi Misr ___ daryosi vodiysida vujudga kelgan.","Nil"],["Misr hukmdorlari ___ deb atalgan.","fir'avn|firavn|fir'avnlar|firavnlar"],["Fir'avnlar uchun qurilgan maqbaralar ___ deb ataladi.","piramida|piramidalar"],["Murdani maxsus usulda saqlash ___ deyiladi.","mumiyolash|mumiyo"],["Misrliklarning yozuvi ___ deb atalgan.","iyeroglif|iyeroglif yozuvi"]]},
{t:"Zardushtiylik va Avesto",g:["Zardushtiylik — qadimgi Markaziy Osiyo va Eron xalqlarining diniy ta'limoti. Uning asoschisi Zardusht (Zaratushtra) hisoblanadi.","Zardushtiylikning muqaddas kitobi Avesto deb ataladi.","Ta'limotga ko'ra, dunyoda ezgulik va yovuzlik o'rtasida kurash boradi. Ezgulik xudosi Axura Mazda, yovuzlik ruhi Axriman deb nomlangan.","Olov zardushtiylar uchun muqaddas hisoblangan, shuning uchun ular olovga sig'inuvchilar deb ham atalgan."],
q:[["Zardushtiylik ta'limotining asoschisi ___.","Zardusht|Zaratushtra|Zoroastr"],["Zardushtiylarning muqaddas kitobi ___ deb ataladi.","Avesto"],["Ezgulik xudosi ___ deb nomlangan.","Axura Mazda|Ahura Mazda|Ahuramazda"],["Yovuzlik ruhi ___ deb atalgan.","Axriman|Ahriman"],["Zardushtiylar uchun muqaddas hisoblangan narsa ___.","olov"]]},
{t:"Afina va Sparta",g:["Qadimgi Yunonistonda alohida shahar-davlatlar — polislar mavjud bo'lgan. Eng yirik polislar Afina va Sparta edi.","Afinada demokratiya (xalq hokimiyati) shakllangan. Muhim masalalar xalq majlisida hal qilingan.","Spartada esa harbiy tartib hukmron bo'lgan. Bolalar yoshligidan jangchi qilib tarbiyalangan.","Yunonlar har to'rt yilda Olimpiya o'yinlarini o'tkazganlar. O'yinlar Zevs sharafiga bag'ishlangan."],
q:[["Qadimgi Yunonistondagi shahar-davlatlar ___ deb atalgan.","polis|polislar"],["Afinada ___ (xalq hokimiyati) shakllangan.","demokratiya"],["Afinada muhim masalalar xalq ___ da hal qilingan.","majlis|majlisi|xalq majlisi"],["Spartada bolalar yoshligidan ___ qilib tarbiyalangan.","jangchi|harbiy"],["Olimpiya o'yinlari har ___ yilda o'tkazilgan.","4|to'rt|turt"]]}
];
const app=document.getElementById('app');let M='s';
const norm=s=>s.toLowerCase().replace(/[ʻʼ’‘`´]/g,"'").replace(/\s+/g,' ').trim();
function mode(m){M=m;t1.className=m=='s'?'on':'';t2.className=m=='t'?'on':'';home()}
function home(){app.innerHTML=T.map((x,i)=>`<button class="btn topic" onclick="open_(${i})">${i+1}. ${x.t}</button>`).join('')}
function open_(i){const x=T[i];let h=`<div class="card guide"><h3>${x.t}</h3>${x.g.map(p=>`<p>${p}</p>`).join('')}</div>`;
if(M=='t'){h+=`<div class="card key"><b>Test savollari va javoblar kaliti</b><ol>${x.q.map(q=>`<li>${q[0]}<br><span class="ok">${q[1].split('|')[0]}</span></li>`).join('')}</ol></div>`;h+=`<button class="btn" onclick="home()">← Orqaga</button>`}
else{h+=`<div class="row"><button class="btn" onclick="home()">← Orqaga</button><button class="btn p" onclick="test(${i})">Testni boshlash</button></div>`}
app.innerHTML=h;scrollTo(0,0)}
function test(i){const x=T[i];let n=0,sc=0,ans=false;
function show(){if(n>=x.q.length){app.innerHTML=`<div class="card"><h3>Natija</h3><p>${sc} / ${x.q.length}</p></div><div class="row"><button class="btn" onclick="home()">Mavzular</button><button class="btn p" onclick="test(${i})">Qayta</button></div>`;return}
ans=false;app.innerHTML=`<div class="card"><div class="sub">${n+1} / ${x.q.length}</div><p>${x.q[n][0]}</p><input type="text" id="a" autocomplete="off" placeholder="Javobingiz"><div id="r"></div></div><div class="row"><button class="btn p" id="b">Tekshirish</button></div>`;
const a=document.getElementById('a'),b=document.getElementById('b');a.focus();
function go(){if(!ans){const ok=x.q[n][1].split('|').some(v=>norm(v)==norm(a.value));if(ok)sc++;ans=true;a.disabled=true;
document.getElementById('r').innerHTML=ok?'<p class="ok">To\'g\'ri!</p>':`<p class="bad">Noto'g'ri. Javob: ${x.q[n][1].split('|')[0]}</p>`;b.textContent=n+1<x.q.length?'Keyingisi':'Natijani ko\'rish'}else{n++;show()}}
b.onclick=go;a.onkeydown=e=>{if(e.key=='Enter')go()}}
show()}
home();
</script>
</body>
</html>
